# Hydra-based runtime configuration
experiment_name: default_experiment
data_dir: data/audio
annotation_dir: data/annotation_data
train_annotation_dir: data/annotation_data_aug
val_annotation_dir: data/annotation_data
segment_duration: "0.1"
model_type: gru
input_type: melspectrogram
batch_size: 32
epochs: 100
lr: 0.001
seed: 42
output_dir: ./results

# Evaluation toggles used by factories.create_eval_strategy
use_topk: false
use_confusion: false

hydra:
  run:
    dir: .
  output_subdir: null
